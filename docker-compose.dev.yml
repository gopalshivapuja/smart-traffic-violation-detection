# Dev-only services: just PostgreSQL and Redis
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic_violations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Map to 5433 on the host so we don't collide with a local system Postgres on 5432.
    # If you have nothing on 5432, switch back to "5432:5432".
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata_dev:
