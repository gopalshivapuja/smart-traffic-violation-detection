server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path returns index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets (Vite hashes filenames).
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
